name: Candy Blast Android Auto Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Detect and Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect Android Gradle project
        shell: bash
        run: |
          set -e
          echo "Searching for Android Gradle project..."

          WRAPPER="$(find . -maxdepth 6 \
            -type f -name gradlew \
            -not -path './.git/*' \
            -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "::error::No Gradle wrapper found. Check that the Android project ZIP is extracted and contains gradlew."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$WRAPPER"

          echo "Project detected at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and AAB
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          ./gradlew --no-daemon \
            assembleDebug bundleDebug

      - name: Upload APK and AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Candy-Blast-Android-Build
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 7
